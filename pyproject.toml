[project]
name = "screenmemory-rag"
version = "0.1.0"
description = "Local-first screenshot OCR and RAG search for macOS."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dateparser>=1.2.0,<2",
  "google-genai>=1.66.0,<2",
  "pillow>=11.0.0,<12",
  "requests>=2.32.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
]
vec = [
  "sqlite-vec>=0.1.6,<0.2",
]

[project.scripts]
screenmemory = "screenmemory.cli:main"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
